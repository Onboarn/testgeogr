<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="pripyat.css">
    <title></title>
</head>

<body>
    <header>

    </header>
    <div class="container">

        <h1>Интерактивная карта по Пряпятскому Национальному Заповеднику:</h1>

        <div class="map-stage">
            <img src="image/IMG-4ac4da59d6d65d2def0ddf056c987865-V.jpg" alt="map">
            <div class="hotspot-layer"></div>
        </div>
        <div class="popup-overlay" hidden></div>

        <div class="map-popup" hidden>
            <button type="button" class="popup-close" aria-label="Закрыть">×</button>

            <h2 class="popup-title"></h2>

            <details class="popup-details1">
                <summary class="popup-summary1"></summary>
                <p class="popup-text"></p>
            </details>

            <details class="popup-details2">
                <summary class="popup-summary2"></summary>
                <video class="popup-video" controls playsinline hidden></video>
            </details>
        </div>


    </div>
    <script src="pripyat.js"></script>
</body>

</html>
